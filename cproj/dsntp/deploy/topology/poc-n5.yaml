# PoC topology: n=5, f=1 (DRS recommended production baseline)
name: poc-n5
n: 5
f: 1
data_plane_port: 47500
control_plane: "http://10.0.0.10:8080"
agents:
  - { id: 1, host: 10.0.0.1, role: consensus_only }
  - { id: 2, host: 10.0.0.2, role: consensus_only }
  - { id: 3, host: 10.0.0.3, role: consensus_only }
  - { id: 4, host: 10.0.0.4, role: gateway }
  - { id: 5, host: 10.0.0.5, role: gateway }
ntp_gateways: [4, 5]
