# DSNTP Agent example config (DR-003)
# n >= 3f+1 ; production baseline n=5 f=1
#
# 单机多 peer 联调（推荐）:
#   deploy/lab-localhost/node{1..4}.conf  — 端口 47501-47504，n=4 f=1
#   powershell -ExecutionPolicy Bypass -File scripts/lab_localhost.ps1 start|stop|status

node_id=1
role=consensus_only
n=5
f=1
period_ms=1000
dmax_ms=10
window_L=10
port=47500
sock_path=/tmp/time-agent.sock
server_endpoint=http://127.0.0.1:8080
require_crypto=0
verify_all=1
