syntax = "proto3";

package dsntp.ctl.v1;

option go_package = "dsntp/ctl/api/v1;ctlv1";

// IF-CTL：Agent ↔ Time Control Server（DRS-002 §9.2）
// 红线：Server 不得参与 P2P 共识，不得改写 Tc。

service ControlPlane {
  // IF-CTL-001：双向流 —— Agent 上报 TimeReport/Event；Server 下推配置/指令
  rpc ReportStream(stream AgentToServer) returns (stream ServerToAgent);

  // IF-CTL-002：轻量心跳（亦可嵌入流内；独立 RPC 便于探针）
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // IF-CTL-003：配置应用回执
  rpc ConfigAck(ConfigAckRequest) returns (ConfigAckResponse);
}

message AgentToServer {
  oneof body {
    TimeReport report = 1;
    EventNotify event = 2;
    HeartbeatRequest heartbeat = 3;
    ConfigAckRequest config_ack = 4;
  }
}

message ServerToAgent {
  oneof body {
    ConfigPush config = 1;
    ExtSyncCommand ext_sync = 2;
    HeartbeatResponse heartbeat_ack = 3;
  }
}

// TimeReport 核心字段（DRS-002 §9.2）
message TimeReport {
  uint32 node_id = 1;
  uint64 seq = 2;
  uint64 reported_at_ns = 3;

  string config_version = 4;
  string params_json = 5; // 可选：T/L/Dmax 等快照

  uint64 monotonic_ns = 6;
  uint64 synced_ns = 7;
  uint64 consensus_tc = 8; // 只读观测，Server 不得回写

  uint64 round = 9;
  string fsm_state = 10;

  double max_peer_offset_ms = 11;
  double rtt_avg_ms = 12;

  repeated PeerSnapshot peers = 13;
}

message PeerSnapshot {
  uint32 peer_id = 1;
  string status = 2; // ok / suspect / fault / silent
  double offset_ms = 3;
  double rtt_ms = 4;
}

message EventNotify {
  uint32 node_id = 1;
  uint64 seq = 2;
  uint64 at_ns = 3;
  string severity = 4; // info / warn / critical
  string code = 5;
  string message = 6;
}

message HeartbeatRequest {
  uint32 node_id = 1;
  uint64 seq = 2;
  uint64 at_ns = 3;
  string fsm_state = 4;
}

message HeartbeatResponse {
  uint64 server_time_ns = 1; // 仅运维参考，不得用于授时
  bool ok = 2;
}

message ConfigPush {
  string version = 1;
  string payload_json = 2; // 配置正文（JSON）
  bool require_ack = 3;
}

message ConfigAckRequest {
  uint32 node_id = 1;
  string version = 2;
  bool applied = 3;
  string error = 4;
}

message ConfigAckResponse {
  bool ok = 1;
}

message ExtSyncCommand {
  uint64 target_time_ns = 1;
  string reason = 2;
  string operator = 3;
}
