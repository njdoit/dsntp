# DSNTP 系统级部署拓扑示例（n=5, f=1）
# 对齐 DRS-002 §4 / §11；仅作骨架，非生产定稿。

system:
  name: dsntp-poc
  n: 5
  f: 1
  data_plane:
    protocol: TSYN
    magic: 0x5453594E
    udp_port: 47500
    version: 0x02
  control_plane:
    grpc_port: 50051
    http_port: 8080
  ntp:
    udp_port: 123

nodes:
  - id: 1
    role: consensus_only
    host: 10.0.0.11
    agent: true
  - id: 2
    role: consensus_only
    host: 10.0.0.12
    agent: true
  - id: 3
    role: consensus_only
    host: 10.0.0.13
    agent: true
  - id: 4
    role: gateway
    host: 10.0.0.14
    agent: true
    ntp_gateway: primary
  - id: 5
    role: gateway
    host: 10.0.0.15
    agent: true
    ntp_gateway: standby

control_server:
  host: 10.0.0.10
  services:
    - dsntp-ctl

wide_clients:
  - type: switch
    ntp_servers: ["10.0.0.14", "10.0.0.15"]
    poll_s: 300
  - type: camera
    ntp_servers: ["10.0.0.14", "10.0.0.15"]
    poll_s: 600

redlines:
  - Server 不参与、不改写 Tc
  - NTP 禁止外源取时
  - FAULT_NOTIFY=0x06; Signature=64B
  - 样本 < 2f+1 不更新 Tc
